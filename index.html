<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="house-container">
        <!-- Achievement -->
        <div class="window" id="window-achievement">
            <div class="content">
                <iframe src="achievement.html" title="Achievement"></iframe>
            </div>
            <img src="achievement_left.png" class="shutter left-shutter" alt="Left Shutter">
            <img src="achievement_right.png" class="shutter right-shutter" alt="Right Shutter">
        </div>

        <!-- Education -->
        <div class="window" id="window-education">
            <div class="content">
                <iframe src="education.html" title="Education"></iframe>
            </div>
            <img src="education_left.png" class="shutter left-shutter" alt="Left Shutter">
            <img src="education_right.png" class="shutter right-shutter" alt="Right Shutter">
        </div>

        <!-- Experience -->
        <div class="window" id="window-experience">
            <div class="content">
                <iframe src="experience.html" title="Experience"></iframe>
            </div>
            <img src="experience_left.png" class="shutter left-shutter" alt="Left Shutter">
            <img src="experience_right.png" class="shutter right-shutter" alt="Right Shutter">
        </div>

        <!-- What I Build -->
        <div class="window" id="window-what-i-build">
            <div class="content">
                <iframe src="what_i_build.html" title="What I Build"></iframe>
            </div>
            <img src="what_i_build_left.png" class="shutter left-shutter" alt="Left Shutter">
            <img src="what_i_build_right.png" class="shutter right-shutter" alt="Right Shutter">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
